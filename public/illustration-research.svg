<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe4d7"/>
      <stop offset="1" stop-color="#d7d0c4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="240" cy="240" r="220" fill="url(#bg2)" opacity=".3"/>
  <circle cx="240" cy="240" r="170" fill="none" stroke="#d7d0c4" stroke-width="1" stroke-dasharray="3 9"/>

  <!-- Open book (large, center) -->
  <g transform="translate(240, 280)">
    <!-- Left page -->
    <path d="M0 0C-40-28-90-32-140-18V-120C-90-134-40-130 0-100Z" fill="#f5f1e9" stroke="#20201c" stroke-width="2"/>
    <!-- Right page -->
    <path d="M0 0C40-28 90-32 140-18V-120C90-134 40-130 0-100Z" fill="#f5f1e9" stroke="#20201c" stroke-width="2"/>
    <!-- Spine -->
    <path d="M0-100V0" stroke="#20201c" stroke-width="2"/>
    <!-- Left text lines -->
    <g stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".5">
      <path d="M-120-100C-90-108-50-106-20-94"/>
      <path d="M-120-82C-90-90-50-88-20-76"/>
      <path d="M-120-64C-90-72-50-70-20-58"/>
      <path d="M-120-46C-90-54-50-52-20-40"/>
    </g>
    <!-- Right text lines -->
    <g stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".5">
      <path d="M20-94C50-106 90-108 120-100"/>
      <path d="M20-76C50-88 90-90 120-82"/>
      <path d="M20-58C50-70 90-72 120-64"/>
      <path d="M20-40C50-52 90-54 120-46"/>
    </g>
  </g>

  <!-- Pen / quill -->
  <g transform="translate(310, 100) rotate(35)">
    <rect x="-4" y="0" width="8" height="100" rx="3" fill="#20201c"/>
    <path d="M-4 100L0 115L4 100" fill="#a74d35"/>
    <rect x="-5" y="12" width="10" height="6" rx="1" fill="#a74d35" opacity=".6"/>
  </g>

  <!-- Ink drops -->
  <circle cx="350" cy="210" r="4" fill="#20201c" opacity=".3"/>
  <circle cx="340" cy="225" r="2.5" fill="#20201c" opacity=".2"/>
  <circle cx="358" cy="220" r="1.5" fill="#20201c" opacity=".15"/>

  <!-- Film reel (cinema connection) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#20201c" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#20201c"/>
    <circle cx="0" cy="0" r="8" fill="#f5f1e9"/>
    <!-- Sprocket holes -->
    <circle cx="0" cy="-28" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <circle cx="28" cy="0" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <circle cx="0" cy="28" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <circle cx="-28" cy="0" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <circle cx="20" cy="-20" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
  </g>

  <!-- Quote marks -->
  <g fill="#a74d35" opacity=".3">
    <text x="160" y="230" font-family="Playfair Display, serif" font-size="80" font-weight="600">"</text>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#20201c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5">
    <path transform="translate(330, 80) scale(.7)" d="M0 0q8-9 16 0q8-9 16 0"/>
    <path transform="translate(370, 60) scale(.5)" d="M0 0q8-9 16 0q8-9 16 0"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#a74d35">
    <circle cx="380" cy="140" r="2.5"/><circle cx="100" cy="350" r="3"/>
    <circle cx="360" cy="380" r="2"/><circle cx="130" cy="280" r="2.5"/>
  </g>
</svg>

