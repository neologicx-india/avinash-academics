<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Literature, cinema and belonging</title>
  <desc id="d">An arch containing a compass, a film strip, an open book and migrating birds.</desc>
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe4d7"/>
      <stop offset="1" stop-color="#d7d0c4"/>
    </linearGradient>
    <pattern id="perf" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect x="7" y="2" width="12" height="6" rx="1.5" fill="#f5f1e9"/>
    </pattern>
  </defs>

  <!-- arch (jharokha-style) -->
  <path d="M70 660V300A230 230 0 0 1 530 300V660Z" fill="url(#arch)"/>
  <path d="M96 660V302A204 204 0 0 1 504 302V660" fill="none" stroke="#a74d35" stroke-width="2" opacity=".8"/>
  <path d="M112 660V304A188 188 0 0 1 488 304V660" fill="none" stroke="#a74d35" stroke-width="1" stroke-dasharray="3 7" opacity=".6"/>

  <!-- soft sun -->
  <circle cx="300" cy="260" r="120" fill="#a74d35" opacity=".1"/>

  <!-- birds (diaspora / migration) -->
  <g fill="none" stroke="#20201c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(190 150)" d="M0 0q8-9 16 0q8-9 16 0"/>
    <path transform="translate(360 120) scale(.8)" d="M0 0q8-9 16 0q8-9 16 0"/>
    <path transform="translate(410 175) scale(.6)" d="M0 0q8-9 16 0q8-9 16 0"/>
    <path transform="translate(150 205) scale(.55)" d="M0 0q8-9 16 0q8-9 16 0"/>
  </g>

  <!-- compass (The Literary Compass) -->
  <g>
    <circle cx="300" cy="270" r="82" fill="#f5f1e9" stroke="#20201c" stroke-width="3"/>
    <circle cx="300" cy="270" r="66" fill="none" stroke="#716f68" stroke-width="1" stroke-dasharray="2 6"/>
    <g stroke="#20201c" stroke-width="2" stroke-linecap="round">
      <path d="M300 192v10M300 338v10M222 270h10M368 270h10"/>
    </g>
    <path d="M300 205L314 270L300 285L286 270Z" fill="#a74d35"/>
    <path d="M300 335L314 270L286 270Z" fill="#68745d"/>
    <circle cx="300" cy="270" r="6" fill="#20201c"/>
  </g>

  <!-- film strip -->
  <g transform="rotate(-14 300 395)">
    <rect x="30" y="365" width="540" height="62" fill="#20201c"/>
    <rect x="30" y="368" width="540" height="10" fill="url(#perf)"/>
    <rect x="30" y="414" width="540" height="10" fill="url(#perf)"/>
    <rect x="48"  y="382" width="94" height="30" rx="3" fill="#a74d35"/>
    <rect x="152" y="382" width="94" height="30" rx="3" fill="#68745d"/>
    <rect x="256" y="382" width="94" height="30" rx="3" fill="#ebe4d7"/>
    <rect x="360" y="382" width="94" height="30" rx="3" fill="#716f68"/>
    <rect x="464" y="382" width="94" height="30" rx="3" fill="#a74d35"/>
  </g>

  <!-- open book -->
  <g>
    <path d="M118 560C190 543 252 548 300 580C348 548 410 543 482 560V574C410 557 348 562 300 594C252 562 190 557 118 574Z" fill="#a74d35"/>
    <path d="M300 566C252 538 190 534 135 549V455C190 440 252 445 300 475Z" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <path d="M300 566C348 538 410 534 465 549V455C410 440 348 445 300 475Z" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <path d="M300 475V566" stroke="#20201c" stroke-width="2"/>
    <g stroke="#716f68" stroke-width="2" stroke-linecap="round" opacity=".6">
      <path d="M160 478C195 470 238 474 276 492"/>
      <path d="M160 496C195 488 238 492 276 510"/>
      <path d="M160 514C195 506 238 510 276 528"/>
      <path d="M324 492C362 474 405 470 440 478"/>
      <path d="M324 510C362 492 405 488 440 496"/>
      <path d="M324 528C362 510 405 506 440 514"/>
    </g>
  </g>

  <!-- floating pages -->
  <g>
    <g transform="translate(120 330) rotate(-18)">
      <rect width="34" height="44" rx="3" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
      <path d="M7 12h20M7 20h20M7 28h13" stroke="#716f68" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g transform="translate(450 300) rotate(14)">
      <rect width="30" height="40" rx="3" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
      <path d="M6 11h18M6 18h18M6 25h11" stroke="#716f68" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>

  <!-- path of belonging -->
  <path d="M300 600C300 625 240 635 200 655M300 600C300 625 360 635 400 655" fill="none" stroke="#a74d35" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- dots -->
  <g fill="#a74d35">
    <circle cx="230" cy="105" r="2.5"/><circle cx="330" cy="90" r="2"/>
    <circle cx="450" cy="230" r="2.5"/><circle cx="150" cy="270" r="2"/>
    <circle cx="500" cy="420" r="2"/><circle cx="100" cy="440" r="2.5"/>
  </g>
</svg>
