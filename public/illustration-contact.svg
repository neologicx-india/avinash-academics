<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe4d7"/>
      <stop offset="1" stop-color="#d7d0c4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="240" cy="240" r="220" fill="url(#bg4)" opacity=".3"/>
  <circle cx="240" cy="240" r="160" fill="none" stroke="#d7d0c4" stroke-width="1" stroke-dasharray="4 10"/>

  <!-- Envelope (large, centered) -->
  <g transform="translate(100, 150)">
    <!-- Envelope body -->
    <rect width="260" height="170" rx="6" fill="#f5f1e9" stroke="#20201c" stroke-width="2"/>
    <!-- Envelope flap -->
    <path d="M0 0L130 90L260 0" fill="none" stroke="#20201c" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner fold lines -->
    <path d="M0 170L110 95 M260 170L150 95" stroke="#d7d0c4" stroke-width="1.5"/>
    <!-- Stamp -->
    <g transform="translate(195, 25)">
      <rect width="42" height="50" rx="2" fill="#a74d35" opacity=".15" stroke="#a74d35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="21" y="32" text-anchor="middle" font-family="Playfair Display, serif" font-size="18" fill="#a74d35" font-weight="500">AJ</text>
    </g>
    <!-- Address lines -->
    <g stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".4">
      <path d="M25 90h120"/>
      <path d="M25 108h100"/>
      <path d="M25 126h80"/>
    </g>
  </g>

  <!-- Floating letter/paper coming out -->
  <g transform="translate(150, 100) rotate(-5)">
    <rect width="160" height="100" rx="4" fill="#fff" stroke="#d7d0c4" stroke-width="1.5" opacity=".9"/>
    <g stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".4">
      <path d="M18 25h124"/>
      <path d="M18 40h100"/>
      <path d="M18 55h110"/>
      <path d="M18 70h70"/>
    </g>
  </g>

  <!-- Pen -->
  <g transform="translate(340, 300) rotate(25)">
    <rect x="-3" y="0" width="6" height="70" rx="2" fill="#20201c"/>
    <path d="M-3 70L0 82L3 70" fill="#a74d35"/>
    <rect x="-4" y="8" width="8" height="5" rx="1" fill="#a74d35" opacity=".5"/>
  </g>

  <!-- Speech / connection bubbles -->
  <g opacity=".3">
    <circle cx="90" cy="120" r="18" fill="none" stroke="#a74d35" stroke-width="1.5"/>
    <circle cx="75" cy="140" r="6" fill="none" stroke="#a74d35" stroke-width="1"/>
    <circle cx="68" cy="155" r="3" fill="none" stroke="#a74d35" stroke-width="1"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#a74d35">
    <circle cx="400" cy="120" r="3"/><circle cx="80" cy="360" r="2.5"/>
    <circle cx="380" cy="380" r="2"/><circle cx="120" cy="200" r="2"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#20201c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".4">
    <path transform="translate(350, 90) scale(.65)" d="M0 0q8-9 16 0q8-9 16 0"/>
    <path transform="translate(390, 75) scale(.45)" d="M0 0q8-9 16 0q8-9 16 0"/>
  </g>
</svg>

