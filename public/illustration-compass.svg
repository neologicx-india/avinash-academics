<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe4d7"/>
      <stop offset="1" stop-color="#d7d0c4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="240" cy="240" r="220" fill="url(#bg1)" opacity=".35"/>
  <circle cx="240" cy="240" r="180" fill="none" stroke="#d7d0c4" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Stack of books -->
  <g transform="translate(120, 260)">
    <!-- Book 1 (bottom) -->
    <rect x="0" y="80" width="240" height="36" rx="4" fill="#a74d35"/>
    <rect x="8" y="84" width="4" height="28" rx="2" fill="#f5f1e9" opacity=".4"/>
    <line x1="30" y1="98" x2="200" y2="98" stroke="#f5f1e9" stroke-width="1.5" opacity=".5"/>

    <!-- Book 2 -->
    <rect x="10" y="48" width="220" height="34" rx="4" fill="#68745d"/>
    <rect x="18" y="52" width="4" height="26" rx="2" fill="#f5f1e9" opacity=".4"/>
    <line x1="38" y1="65" x2="190" y2="65" stroke="#f5f1e9" stroke-width="1.5" opacity=".5"/>

    <!-- Book 3 -->
    <rect x="20" y="18" width="200" height="32" rx="4" fill="#20201c"/>
    <rect x="28" y="22" width="4" height="24" rx="2" fill="#f5f1e9" opacity=".3"/>
    <line x1="46" y1="34" x2="180" y2="34" stroke="#f5f1e9" stroke-width="1.5" opacity=".3"/>

    <!-- Book 4 (top, open-ish) -->
    <rect x="30" y="-12" width="180" height="32" rx="4" fill="#a74d35" opacity=".7"/>
    <rect x="38" y="-8" width="4" height="24" rx="2" fill="#f5f1e9" opacity=".4"/>
    <line x1="56" y1="2" x2="170" y2="2" stroke="#f5f1e9" stroke-width="1.5" opacity=".5"/>
  </g>

  <!-- Compass on top of books -->
  <g transform="translate(240, 190)">
    <circle cx="0" cy="0" r="60" fill="#f5f1e9" stroke="#20201c" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#716f68" stroke-width="1" stroke-dasharray="2 5"/>
    <!-- Cardinal marks -->
    <g stroke="#20201c" stroke-width="1.5" stroke-linecap="round">
      <path d="M0-56v8 M0 48v8 M-56 0h8 M48 0h8"/>
    </g>
    <!-- Needle -->
    <path d="M0-45L10 0L0 10L-10 0Z" fill="#a74d35"/>
    <path d="M0 45L10 0L-10 0Z" fill="#68745d"/>
    <circle cx="0" cy="0" r="4.5" fill="#20201c"/>
    <!-- N label -->
    <text x="0" y="-62" text-anchor="middle" font-family="DM Mono, monospace" font-size="10" fill="#a74d35" font-weight="500">N</text>
  </g>

  <!-- Floating page -->
  <g transform="translate(340, 140) rotate(12)">
    <rect width="40" height="52" rx="3" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <path d="M8 14h24M8 22h24M8 30h16" stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- Floating page 2 -->
  <g transform="translate(100, 170) rotate(-15)">
    <rect width="34" height="44" rx="3" fill="#f5f1e9" stroke="#20201c" stroke-width="1.5"/>
    <path d="M7 12h20M7 20h20M7 28h12" stroke="#716f68" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#a74d35">
    <circle cx="370" cy="100" r="3"/><circle cx="110" cy="120" r="2.5"/>
    <circle cx="390" cy="360" r="2"/><circle cx="90" cy="380" r="3"/>
  </g>
</svg>

